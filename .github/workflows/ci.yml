name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      # ctest exits non-zero on any test failure, failing the build.
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ThreadSanitizer)
        run: >
          cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g -O1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

      - name: Build (ThreadSanitizer)
        run: cmake --build build-tsan -j$(nproc)

      # Halt on the first reported race; any failure fails the job.
      - name: Test under TSan
        working-directory: build-tsan
        env:
          TSAN_OPTIONS: "halt_on_error=1 history_size=7"
        run: ctest --output-on-failure
